<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-transform: capitalize;
            color: #333;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Navigation Buttons Styling */
        .nav-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }

        .nav-actions a {
            text-decoration: none;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #4a90e2;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #357abd;
            transform: translateY(-1px);
        }

        /* Distinct colors for actions */
        .btn-save { background-color: #2ecc71; }
        .btn-save:hover { background-color: #27ae60; }

        .btn-update { background-color: #f39c12; }
        .btn-update:hover { background-color: #d68910; }

        .btn-delete { background-color: #e74c3c; }
        .btn-delete:hover { background-color: #c0392b; }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.2s ease;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        /* Empty state styling */
        td[colspan] {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee List</h1>
        
        <div class="nav-actions">
            <a href="{% url 'saveuser' %}"><button class="btn btn-save">Save Employee</button></a>
            <a href="{% url 'employeelist' %}"><button class="btn">Show Employees</button></a>
            <a href="{% url 'updateEmployee' %}"><button class="btn btn-update">Update Employee</button></a>
            <a href="{% url 'deleteEmployee' %}"><button class="btn btn-delete">Delete Employee</button></a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Employee No.</th>
                    <th>Employee Name</th>
                    <th>Employee Salary</th>
                </tr>
            </thead>
            <tbody>
                {% for i in Employees %}
                <tr>
                    <td>{{ i.id }}</td>
                    <td>{{ i.Eno }}</td>
                    <td>{{ i.ename }}</td>
                    <td>{{ i.esal }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">No employees found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
