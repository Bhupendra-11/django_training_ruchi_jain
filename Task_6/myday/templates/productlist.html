<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
</head>
<body>
    <div>
        <h1>Product list</h1>
        <table>
            <tr>
                <th>ID: </th>
                <th>Product no.: </th>
                <th>Product name: </th>
                <th>Product price: </th>
                <th>Product offer: </th>
            </tr>
           {% for i in Product %}
           <tr>
               <td>{{ i.id }}</td>
               <td>{{ i.p_no }}</td>
               <td>{{ i.p_name }}</td>
               <td>{{ i.p_price }}</td>
               <td>{{ i.p_offer }}</td>
            </tr>
            {% endfor %} 
        </table>
    </div>
</body>
</html>
