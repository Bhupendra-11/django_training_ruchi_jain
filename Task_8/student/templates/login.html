<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>This is LOGIN Page</h1>
    </div>
    <form action="{% url 'login_valid' %}" method="post">
        {% csrf_token %}
        <div>
            <label for="s_username">Username: </label>
        </div>
        <div>
            <input type="text" name="s_username" id="s_username">
        </div>
        <div>
            <label for="s_passsword">Password: </label>
        </div>
        <div>
            <input type="password" name="s_password" id="s_password">
        </div>
        <div>
            <input type="submit" value="Login">
        </div>
        <span>{{ erg }}</span>
        <br><a href="{% url 'signup' %}">Create Account</a>
    </form>
</body>
</html>
