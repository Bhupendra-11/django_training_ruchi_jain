<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTec Website Button</title>
    <style>
        .sistec-btn {
            background-color: #0056b3; /* Button ka color */
            color: white; /* Text ka color */
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-family: Arial, sans-serif;
        }
        .sistec-btn:hover {
            background-color: #004085; /* Mouse le jaane par color change hoga */
        }
    </style>
</head>
<body>

    <!-- Yeh hai aapka button jo SISTec ki website par le jayega -->
    <a href="https://www.sistecgn.ac.in/" target="_blank" class="sistec-btn">
        Go to SISTec Website
    </a>

</body>
</html>
